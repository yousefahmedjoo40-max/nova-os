name: Build NovaOS ISO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune -a -f || true

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build live-config live-boot debootstrap \
            dosfstools mtools squashfs-tools xorriso isolinux syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin ca-certificates

      - name: Build ISO
        working-directory: .
        run: |
          chmod +x ./build.sh
          sudo ./build.sh

      - name: Locate ISO artifact
        id: locate
        run: |
          ISO_PATH=$(ls -1 novaos-*.iso | head -n1)
          SHA_PATH="${ISO_PATH}.sha256"
          echo "iso_path=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "sha_path=$SHA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate.outputs.iso_path }}
            ${{ steps.locate.outputs.sha_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
